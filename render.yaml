services:
  - type: web
    name: quizzapp
    runtime: docker
    repo: https://github.com/kaushiksharma639/QuizzApp
    branch: master
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quizzapp-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: quizzapp-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: quizzapp-db
          property: password

databases:
  - name: quizzapp-db
    databaseName: quizz_question
    plan: free